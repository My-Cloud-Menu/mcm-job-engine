version: '3.8'

# Shared config block — override per service with `environment:`
x-common: &common
  build: .
  image: mcm-job-engine:latest
  restart: unless-stopped
  env_file: .env
  networks:
    - app

services:
  worker-pos-injection:
    <<: *common
    container_name: worker-pos-injection
    environment:
      WORKER_QUEUE_NAME: pos_injection
      WORKER_MAX_CONCURRENT_JOBS: "20"
      WORKER_POLL_INTERVAL_MS: "1000"
      RUN_SCHEDULER: "false"
      RUN_ALERT_DISPATCHER: "false"

  worker-pos-sync:
    <<: *common
    container_name: worker-pos-sync
    environment:
      WORKER_QUEUE_NAME: pos_sync
      WORKER_MAX_CONCURRENT_JOBS: "30"
      WORKER_POLL_INTERVAL_MS: "2000"
      # Only this container runs the scheduler and alert dispatcher.
      # If scaling to multiple replicas, the advisory lock ensures only one is active.
      RUN_SCHEDULER: "true"
      RUN_ALERT_DISPATCHER: "true"

  worker-notifications:
    <<: *common
    container_name: worker-notifications
    environment:
      WORKER_QUEUE_NAME: notifications
      WORKER_MAX_CONCURRENT_JOBS: "30"
      WORKER_POLL_INTERVAL_MS: "2000"
      RUN_SCHEDULER: "false"
      RUN_ALERT_DISPATCHER: "false"

  worker-webhooks:
    <<: *common
    container_name: worker-webhooks
    environment:
      WORKER_QUEUE_NAME: webhooks
      WORKER_MAX_CONCURRENT_JOBS: "10"
      WORKER_POLL_INTERVAL_MS: "5000"
      RUN_SCHEDULER: "false"
      RUN_ALERT_DISPATCHER: "false"

  # Push de impresión QZ (vía gateway WS del print-service) y Star (REST). Epson es pull
  # (lo sirve mcm-print-service) + reaper pg_cron → no consume de esta cola.
  worker-printing:
    <<: *common
    container_name: worker-printing
    environment:
      WORKER_QUEUE_NAME: printing
      WORKER_MAX_CONCURRENT_JOBS: "20"
      WORKER_POLL_INTERVAL_MS: "2000"
      RUN_SCHEDULER: "false"
      RUN_ALERT_DISPATCHER: "false"
      # PRINT_SERVICE_URL / PRINT_SERVICE_INTERNAL_TOKEN / STAR_PRINT_* van en .env

  # Suscripciones (cola billing): cobro recurrente, dunning y avisos del modulo subs_*.
  # Concurrencia BAJA a proposito: es dinero, y cada job llama a una edge function que cobra.
  # El limite global tambien esta en integration_concurrency_limits ('billing','subs',10).
  worker-billing:
    <<: *common
    container_name: worker-billing
    environment:
      WORKER_QUEUE_NAME: billing
      WORKER_MAX_CONCURRENT_JOBS: "5"
      WORKER_POLL_INTERVAL_MS: "3000"
      RUN_SCHEDULER: "false"
      RUN_ALERT_DISPATCHER: "false"

networks:
  app:
    driver: bridge
